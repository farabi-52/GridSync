#
# Bangladesh (BD) — 2040 planning-horizon scenario
# 15-bus simplified network | transmission expansion allowed | hourly resolution
# Second milestone year in your paper's 2030 -> 2040 -> (2041 Vision) trajectory.
# Derived from config.bd_2030.yaml — only the deltas that matter for 2040 are called out below.

version: 0.3.0
tutorial: false

logging:
  level: INFO
  format: "%(levelname)s:%(name)s:%(message)s"

countries: ["BD"]
output_currency: USD
currency_year: 2020
cost_scenario: central
financial_case: market

policy_config:
  hydrogen:
    enable: false        # keep off in this power-only run; duplicate into a sector-coupled 2040 file for H2/EV results
    additionality: false
    is_reference: false
    temporal_matching: no_res_matching

solar_thermal: {}
existing_capacities: {}

enable:
  retrieve_databundle: false        # set true only once for first-ever run; false here assumes 2030 run already cached resources
  retreive_databundle_light: false
  retrieve_cost_data: true          # cost year changes (2040 vs 2030) so technology-data must be re-pulled for the new cost year
  download_osm_data: false
  build_natura_raster: false
  build_cutout: false
  build_renewable_profiles: true    # must rebuild — 2040 demand/capacity ceilings differ from 2030
  progress_bar: true

custom_rules: []

run:
  name: "BD_2040_15cl_RES27p5"      # distinct run name so 2030 and 2040 results never overwrite each other in results/
  shared_cutouts: true              # still true: same ERA5 2018 weather year cutout reused across horizons

scenario:
  simpl: ['']
  sopts: ['']
  planning_horizons: "2040"                    # <-- core change
  ll: ['copt']
  clusters: [15]
  opts: ['Co2L-RES0.275-6H']                    # RE target raised to 27.5% per your own 2030->2040->2050 (15/27.5/30%) trajectory
  demand: "era5_2018"                            # weather year stays 2018 (same ERA5 cutout); only the demand LEVEL changes via load_options.prediction_year
  technologies: [onwind, solar, hydro]

demand_data:
  update_data: false
  base_year: 2040                                # <-- core change, was 2030
  other_industries: false
  aluminium_year: false

sector:
  chp: false
  transmission_efficiency: 0.975     # slightly improved vs. 2030 (0.971) — assumes modest grid-loss reduction from planned upgrades; revise if your paper uses a flat value across horizons
  airport_sizing_factor: 1.0
  gas: {}
  h2_underground:
    use: false
    countries: []
  hydrogen:
    network: false
    enable: false
    set_color_shares: false
    additionality: false
    is_reference: false
    temporal_matching: no_res_matching
  ship:
    enable: false
  heat_pump_sink_T: 55
  space_heat_share: 0.5
  coal:
    shift_to_elec: false
  industry_util_factor: 0.75         # marginally higher than 2030 (0.7) reflecting industrial capacity utilization growth — adjust to your actual assumption

fossil_reserves:
  use: false
  file: ""

custom_data:
  export_ports: false
  airports: false
  gas_network: false
  h2_underground:
    use: false
    countries: []
  water_costs: false
  renewables: []
  industry_database: false
  industry_demand: false
  add_existing: false          # <-- core change: 2040 should NOT force-replace with only your current custom_powerplants.csv fleet,
                                 # since by 2040 many committed-but-not-yet-built plants (Rooppur, Matarbari, new CCGTs) must be
                                 # allowed to enter via greenfield/estimated capacities. Your own 2040 mix (Nuclear 7.8%, Wind 5.4%)
                                 # cannot appear if the model is pinned to today's existing fleet only.

foresight:
  enable: false                 # still a single-horizon snapshot run; set true + years:[2030,2040] only if you run myopic pathway optimization
  years: []

snapshots:
  start: "2018-01-01"
  end: "2019-01-01"
  inclusive: "left"

crs:
  geo_crs: 'EPSG:4326'
  distance_crs: 'EPSG:3857'
  area_crs: 'ESRI:54009'

augmented_line_connection:
  add_to_snakefile: false
  connectivity_upgrade: 3
  new_line_type: ["HVAC"]
  min_expansion: 1
  min_DC_length: 200

cluster_options:
  simplify_network:
    to_substations: false
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
    remove_stubs: true
    remove_stubs_across_borders: true
    p_threshold_drop_isolated: 2500
    p_threshold_merge_isolated: 4000
  cluster_network:
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
  alternative_clustering: false
  distribute_cluster: ['load']
  out_logging: true
  aggregation_strategies:
    generators:
      p_nom: sum
      p_nom_min: sum
      p_min_pu: mean
      marginal_cost: mean
      committable: any
      ramp_limit_up: max
      ramp_limit_down: max
      efficiency: mean

build_shape_options:
  gadm_layer_id: 1
  update_file: false
  out_logging: true
  year: 2020
  nprocesses: 5
  worldpop_method: "standard"
  gdp_method: "standard"
  contended_flag: "set_by_country"
  simplify_gadm: false

clean_osm_data_options:
  names_by_shapes: true
  threshold_voltage: 31000
  tag_substation: "transmission"
  add_line_endings: true
  generator_name_method: OSM
  use_custom_lines: "OSM_only"
  path_custom_lines: false
  use_custom_substations: "OSM_only"
  path_custom_substations: false
  use_custom_cables: "OSM_only"
  path_custom_cables: false

build_osm_network:
  group_close_buses: true
  group_tolerance_buses: 10000
  split_overpassing_lines: true
  overpassing_lines_tolerance: 1
  force_ac: false

base_network:
  min_voltage_substation_offshore: 31000
  min_voltage_rebase_voltage: 31000

load_options:
  ssp: "ssp2-4.5"
  weather_year: 2018
  prediction_year: 2040        # <-- core change, was 2030 (drives GDP/population-scaled demand growth)
  scale: 2.235                  # keep same demand-scaling factor unless your paper recalibrated it for 2040; verify against your validated 2019->2024 growth rate

electricity:
  base_voltage: 132.
  voltages: [66., 132., 230., 400.]

  co2limit: 4.2e+7             # tightened further vs. 2030 (4.5e+7) consistent with RES0.275; NOTE: your own 2040 generation-mix
                                 # result shows coal share RISING (20.6%->28.2%) while gas falls — if you intend that exact mix,
                                 # this limit may need loosening rather than tightening. Set this to match whichever narrative
                                 # (deeper decarbonization vs. "coal persists to 2040") your final paper commits to.
  co2base: 4.67e+7             # unchanged — same fixed 2018 historical baseline used for both horizons, only the limit tightens over time
  agg_p_nom_limits: data/agg_p_nom_minmax.csv
  hvdc_as_lines: false
  automatic_emission: false
  automatic_emission_base_year: 2018

  operational_reserve:
    activate: false
    epsilon_load: 0.02
    epsilon_vres: 0.02
    contingency: 0

  max_hours:
    battery: 12
    H2: 168

  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, CCGT, OCGT, nuclear]   # <-- nuclear added: Rooppur must be a
                                                                                 # buildable/available carrier by 2040 for your
                                                                                 # own 7.8% nuclear share result to be reproducible
    StorageUnit: []
    Store: [battery, H2]
    Link: [H2 electrolysis]
    p_nom_max: 2.0

  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

  extendable_parameters:
    solar:
      p_nom_max: 9000        # raised from 5000 (2030) — your 2040 mix shows solar share growing (7%->7.9%) against a larger total demand base
    onwind:
      p_nom_max: 2500        # raised from 1000 — wind share nearly doubles (3%->5.4%) in your own 2040 result
    offwind-ac:
      p_nom_max: 1000
    offwind-dc:
      p_nom_max: 3000

  powerplants_filter: (DateIn <= 2040) & (DateOut >= 2040 | DateOut != DateOut)   # <-- core change, window shifted to 2040
  custom_powerplants: merge      # <-- core change from "replace": by 2040 you need BOTH your validated existing/committed
                                   # fleet AND powerplantmatching data / greenfield candidates (Rooppur, new CCGTs) merged in

  conventional_carriers: [oil, OCGT, CCGT, coal, nuclear]   # <-- nuclear re-added for 2040 only (Rooppur commissioning
                                                              # expected before 2040 in IEPMP 2023 timelines — confirm exact
                                                              # commissioning year against IEPMP 2023.pdf before finalizing)

  estimate_renewable_capacities:
    stats: "irena"
    year: 2020
    p_nom_min: 1
    p_nom_max: false
    technology_mapping:
      Offshore: [offwind-ac, offwind-dc]
      Onshore: [onwind]
      PV: [solar]

sector_coupling:
  h2_fertilizer: false

lines:
  ac_types:
    66.: "Al/St 240/40 2-bundle 220.0"
    132.: "Al/St 240/40 2-bundle 220.0"
    230.: "Al/St 240/40 3-bundle 300.0"
    400.: "Al/St 560/50 4-bundle 750.0"
  dc_types:
    66.:  "HVDC XLPE 1000"
    132.: "HVDC XLPE 1000"
    230.: "HVDC XLPE 1000"
    400.: "HVDC XLPE 1000"
  s_max_pu: 0.7
  s_nom_max: .inf
  length_factor: 1.25
  under_construction: "zero"

links:
  p_max_pu: 1.0
  p_nom_max: .inf
  under_construction: "zero"

transformers:
  x: 0.1
  s_nom: 2000.
  type: ""

export:
  results: true
  plots: true
  excel: false
  netcdf: true
  ship: false
  store: false
  store_capital_costs: false
  export_profile: false
  endogenous: false
  endogenous_price: false
  h2export: false

atlite:
  nprocesses: 4
  cutouts:
    cutout-2018-era5:
      module: era5
      dx: 0.3
      dy: 0.3

renewable:
  onwind:
    cutout: cutout-2018-era5
    resource:
      method: wind
      turbine: Vestas_V112_3MW
    capacity_per_sqkm: 3
    copernicus:
      grid_codes: [20, 30, 40, 60]
      distance: 1000
      distance_grid_codes: [50]
    natura: true
    potential: conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  offwind-ac:
    cutout: cutout-2018-era5
    resource:
      method: wind
      turbine: NREL_ReferenceTurbine_5MW_offshore
    capacity_per_sqkm: 2
    correction_factor: 0.8855
    copernicus:
      grid_codes: [80, 200]
    natura: true
    max_depth: 50
    max_shore_distance: 30000
    potential: simple
    clip_p_max_pu: 1.e-2
    extendable: true
  offwind-dc:
    cutout: cutout-2018-era5
    resource:
      method: wind
      turbine: NREL_ReferenceTurbine_5MW_offshore
    capacity_per_sqkm: 3
    correction_factor: 0.8855
    copernicus:
      grid_codes: [80, 200]
    natura: true
    max_depth: 50
    min_shore_distance: 30000
    potential: conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  solar:
    cutout: cutout-2018-era5
    resource:
      method: pv
      panel: CSi
      orientation: latitude_optimal
    capacity_per_sqkm: 4.6
    correction_factor: 0.854337
    copernicus:
      grid_codes: [20, 30, 40, 50, 60, 90, 100]
    natura: true
    potential: simple
    clip_p_max_pu: 1.e-2
    extendable: true
  hydro:
    cutout: cutout-2013-era5
    hydrobasins_level: 4
    resource:
      method: hydro
      hydrobasins: data/hydrobasins/hybas_world.shp
      flowspeed: 1.0
    carriers: [ror, PHS, hydro]
    PHS_max_hours: 6
    hydro_max_hours: "energy_capacity_totals_by_country"
    hydro_max_hours_default: 6.0
    clip_min_inflow: 1.0
    extendable: true
    multiplier: 1.0

costs:
  year: 2040                     # <-- core change, was 2030 — pulls 2040 technology-data cost projections (CAPEX/OPEX decline curves)
  technology_data_version: v0.5.0
  version: v0.5.0
  rooftop_share: 0.20
  output_currency: USD
  cost_scenario: central
  financial_case: market
  currency_year: 2020
  retrieve_cost_data: true
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    CO2 intensity: 0
    discount rate: 0.07
  marginal_cost:
    solar: 0.0100          # slightly lower than 2030 (0.0118) reflecting continued O&M cost decline — revise against your actual technology-data pull for cost.year 2040
    onwind: 0.0160
    offwind: 0.0160
    hydro: 0.
    H2: 0.
    electrolysis: 0.
    fuel cell: 0.
    battery: 0.
    battery inverter: 0.
  emission_prices:
    co2: 0.
  discountrate: 0.07

monte_carlo:
  options:
    add_to_snakefile: false
    samples: 7
    sampling_strategy: "chaospy"
  pypsa_standard:
    loads_t.p_set: [0.9, 1.1]

results_dir: "results"
summary_dir: "results/summary"
logs_dir: "logs"

subregions:
  add: false
subregion:
  define_by_gadm: {}
  path_custom_shapes: ""

solving:
  solver:
    name: highs
    options: highs-ipm
  solver_options:
    highs-ipm:
      solver: "ipm"
      run_crossover: "on"
      threads: 6
      parallel: "on"
      presolve: "on"
      primal_feasibility_tolerance: 1.0e-4
      dual_feasibility_tolerance: 1.0e-4
      ipm_optimality_tolerance: 1.0e-4
      user_bound_scale: 0
  options:
    minimum_renewable_generation: 0.20
    skip_iterations: true
    max_iterations: 1
    nhours: 8760
    min_iterations: 1
    load_shedding: true
    noisy_costs: true
    store_basis: true
    keep_references: true
    keep_shadowprices: ['Generator', 'StorageUnit', 'Store', 'Bus', 'Line', 'Transformer', 'Link']

plotting:
  map:
    figsize: [7, 7]
    boundaries: [88.01, 20.6, 92.7, 26.6]
    p_nom:
      bus_size_factor: 5.e+4
      linewidth_factor: 3.e+3

  costs_max: 800
  costs_threshold: 1

  energy_max: 20000.          # raised from 15000 (2030) to accommodate higher 2040 demand/generation without clipping plots
  energy_min: -10000.
  energy_threshold: 50.

  vre_techs: ["onwind", "offwind-ac", "offwind-dc", "solar", "ror"]
  conv_techs: ["OCGT", "CCGT", "coal", "oil", "nuclear"]     # nuclear re-added for 2040 plotting consistency
  storage_techs: ["hydro+PHS", "battery", "H2"]
  load_carriers: ["AC load"]
  AC_carriers: ["AC line", "AC transformer"]
  link_carriers: ["DC line", "Converter AC-DC"]
  tech_colors:
    "onwind": "#235ebc"
    "onshore wind": "#235ebc"
    "offwind": "#6895dd"
    "offwind-ac": "#6895dd"
    "offshore wind": "#6895dd"
    "offshore wind ac": "#6895dd"
    "offwind-dc": "#74c6f2"
    "offshore wind dc": "#74c6f2"
    "hydro": "#08ad97"
    "hydro+PHS": "#08ad97"
    "PHS": "#08ad97"
    "hydro reservoir": "#08ad97"
    "hydroelectricity": "#08ad97"
    "ror": "#4adbc8"
    "run of river": "#4adbc8"
    "solar": "#f9d002"
    "solar PV": "#f9d002"
    "solar thermal": "#ffef60"
    "biomass": "#0c6013"
    "solid biomass": "#06540d"
    "biogas": "#23932d"
    "waste": "#68896b"
    "geothermal": "#ba91b1"
    "OCGT": "#d35050"
    "gas": "#d35050"
    "natural gas": "#d35050"
    "CCGT": "#b20101"
    "nuclear": "#ff9000"
    "coal": "#707070"
    "lignite": "#9e5a01"
    "oil": "#262626"
    "H2": "#ea048a"
    "hydrogen storage": "#ea048a"
    "battery": "#b8ea04"
    "Electric load": "#f9d002"
    "electricity": "#f9d002"
    "lines": "#70af1d"
    "transmission lines": "#70af1d"
    "AC-AC": "#70af1d"
    "AC line": "#70af1d"
    "links": "#8a1caf"
    "HVDC links": "#8a1caf"
    "DC-DC": "#8a1caf"
    "DC link": "#8a1caf"
    "load": "#FF0000"
  nice_names:
    OCGT: "Open-Cycle Gas"
    CCGT: "Combined-Cycle Gas"
    offwind-ac: "Offshore Wind (AC)"
    offwind-dc: "Offshore Wind (DC)"
    onwind: "Onshore Wind"
    solar: "Solar"
    PHS: "Pumped Hydro Storage"
    hydro: "Reservoir & Dam"
    battery: "Battery Storage"
    H2: "Hydrogen Storage"
    lines: "Transmission Lines"
    nuclear: "Nuclear"
    ror: "Run of River"
