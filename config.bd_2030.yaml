#
# Bangladesh (BD) — 2030 planning-horizon scenario
# 15-bus simplified network | transmission expansion allowed | hourly resolution
# Aligned with thesis/paper: capacity-expansion + EV smart-charging + green-H2 sector coupling

version: 0.3.0
tutorial: false

logging:
  level: INFO
  format: "%(levelname)s:%(name)s:%(message)s"

countries: ["BD"]
output_currency: USD
currency_year: 2020
cost_scenario: central       # typical values: central (or whatever your costs.csv contains)
financial_case: market

# --------------------------------------------------------------------------
# Hydrogen policy: keep disabled for the POWER-ONLY 2030 capacity-expansion
# run (this config). Your green-H2/EV sector-coupling results are produced
# by a SEPARATE sector-coupled run (see notes at bottom) — do not try to mix
# the two in one Snakemake pass, it will create ambiguous DAG branches.
# --------------------------------------------------------------------------
policy_config:
  hydrogen:
    enable: false
    additionality: false
    is_reference: false
    temporal_matching: no_res_matching

solar_thermal: {}
existing_capacities: {}

enable:
  retrieve_databundle: true          # keep true until first successful run confirms local data cache
  retreive_databundle_light: false
  retrieve_cost_data: true           # true = pull technology-data cost assumptions instead of stale data/costs.csv
  download_osm_data: false           # set true only if you need a fresh OSM pull; keep false for reproducible reruns
  build_natura_raster: false
  build_cutout: false                # keep false once cutout-2018-era5 already exists in resources/cutouts
  build_renewable_profiles: true
  progress_bar: true

custom_rules: []

run:
  name: "BD_2030_15cl_RES30"   # tag this run distinctly from any 2040/2041/2050 horizon runs
  shared_cutouts: true

scenario:
  simpl: ['']
  sopts: ['']
  planning_horizons: "2030"
  ll: ['copt']                       # optimal transmission expansion allowed, per your brief
  clusters: [15]                     # 15-bus simplified BD grid, matches your paper's higher-resolution claim over PyPSA-BD's 9
  opts: ['Co2L-RES0.30-6H']          # CO2-limited + explicit 30% RES floor, 6-hourly resolution snapshots
  demand: "era5_2018"
  technologies: [onwind, solar, hydro]

demand_data:
  update_data: false
  base_year: 2030
  other_industries: false
  aluminium_year: false

# --------------------------------------------------------------------------
# Sector-coupling block. For THIS power-only 2030 run everything stays off.
# When you run the dedicated sector-coupled scenario for your EV/H2 results,
# duplicate this file, set hydrogen.enable / h2_fertilizer / EV options true
# there, and give it its own `run.name` (e.g. BD_2030_sector_H2EV).
# --------------------------------------------------------------------------
sector:
  chp: false
  transmission_efficiency: 0.971     # matches 2019 loss benchmark you used for validation
  airport_sizing_factor: 1.0
  gas: {}
  h2_underground:
    use: false
    countries: []
  hydrogen:
    network: false
    enable: false
    set_color_shares: false
    additionality: false
    is_reference: false
    temporal_matching: no_res_matching
  ship:
    enable: false
  heat_pump_sink_T: 55
  space_heat_share: 0.5
  coal:
    shift_to_elec: false
  industry_util_factor: 0.7

fossil_reserves:
  use: false
  file: ""

custom_data:
  export_ports: false
  airports: false
  gas_network: false
  h2_underground:
    use: false
    countries: []
  water_costs: false
  renewables: []
  industry_database: false
  industry_demand: false
  add_existing: true          # true: reads your custom_powerplants.csv-based existing fleet instead of a greenfield build

foresight:
  enable: false                # single 2030 snapshot horizon; switch to true only for a joint 2030->2041->2050 pathway run
  years: []

snapshots:
  start: "2018-01-01"
  end: "2019-01-01"
  inclusive: "left"

crs:
  geo_crs: 'EPSG:4326'
  distance_crs: 'EPSG:3857'
  area_crs: 'ESRI:54009'

augmented_line_connection:
  add_to_snakefile: false
  connectivity_upgrade: 3
  new_line_type: ["HVAC"]
  min_expansion: 1
  min_DC_length: 200

cluster_options:
  simplify_network:
    to_substations: false
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
    remove_stubs: true
    remove_stubs_across_borders: true
    p_threshold_drop_isolated: 2500
    p_threshold_merge_isolated: 4000
  cluster_network:
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
  alternative_clustering: false
  distribute_cluster: ['load']
  out_logging: true
  aggregation_strategies:
    generators:
      p_nom: sum
      p_nom_min: sum
      p_min_pu: mean
      marginal_cost: mean
      committable: any
      ramp_limit_up: max
      ramp_limit_down: max
      efficiency: mean

build_shape_options:
  gadm_layer_id: 1
  update_file: false
  out_logging: true
  year: 2020
  nprocesses: 5
  worldpop_method: "standard"
  gdp_method: "standard"
  contended_flag: "set_by_country"
  simplify_gadm: false

clean_osm_data_options:
  names_by_shapes: true
  threshold_voltage: 31000
  tag_substation: "transmission"
  add_line_endings: true
  generator_name_method: OSM
  use_custom_lines: "OSM_only"
  path_custom_lines: false
  use_custom_substations: "OSM_only"
  path_custom_substations: false
  use_custom_cables: "OSM_only"
  path_custom_cables: false

build_osm_network:
  group_close_buses: true
  group_tolerance_buses: 10000
  split_overpassing_lines: true
  overpassing_lines_tolerance: 1
  force_ac: false

base_network:
  min_voltage_substation_offshore: 31000
  min_voltage_rebase_voltage: 31000

load_options:
  ssp: "ssp2-4.5"           # matches your own note: "we should use 2-4.5" instead of 2-2.6
  weather_year: 2018
  prediction_year: 2030
  scale: 2.235

# ============================================================================
# ELECTRICITY BLOCK — restructured. The original file nested a second
# `electricity:` map and a second `max_hours:` key inside the first
# `electricity:` block; YAML silently keeps only the LAST occurrence of a
# duplicate key, which was quietly deleting your co2limit/extendable_carriers
# settings. Everything is now flattened into ONE electricity: block.
# ============================================================================
electricity:
  base_voltage: 132.
  voltages: [66., 132., 230., 400.]

  co2limit: 4.5e+7          # ~35% below your 2018 power-sector baseline (see co2base), consistent with a 2030 RES0.30 pathway
  co2base: 4.67e+7          # Bangladesh POWER-SECTOR CO2 in 2018 (~46.7 Mt CO2, UNFCCC BUR1 electricity-generation category)
                             # NOTE: the European default (7.75e7) you had here was never adjusted for BD — this was the
                             # single most important bug to fix, since co2limit/co2base drive the whole decarbonization target.
  agg_p_nom_limits: data/agg_p_nom_minmax.csv
  hvdc_as_lines: false
  automatic_emission: false
  automatic_emission_base_year: 2018

  operational_reserve:
    activate: false
    epsilon_load: 0.02
    epsilon_vres: 0.02
    contingency: 0

  max_hours:
    battery: 12
    H2: 168

  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, CCGT, OCGT]
    StorageUnit: []
    Store: [battery, H2]
    Link: [H2 electrolysis]
    p_nom_max: 2.0

  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

  extendable_parameters:
    solar:
      p_nom_max: 5000       # MW, national solar ceiling — matches northwestern-BD solar potential emphasis in your intro
    onwind:
      p_nom_max: 1000
    offwind-ac:
      p_nom_max: 500
    offwind-dc:
      p_nom_max: 2000

  powerplants_filter: (DateIn <= 2030) & (DateOut >= 2030 | DateOut != DateOut)
  custom_powerplants: replace

  conventional_carriers: [oil, OCGT, CCGT, coal]     # dropped nuclear/lignite/geothermal/biomass — none exist in BD's 2030 fleet per your validation table
  # NOTE: BD's 2030 mix from your own results (Gas 45.7%, Coal 20.6%, Oil 7%, Solar 7%, imports, Wind 3%) has
  # zero nuclear/lignite/geothermal/biomass online in 2030 (Rooppur nuclear only commissions post-2030 in most IEPMP timelines —
  # verify against the IEPMP 2023 commissioning date you used before re-adding "nuclear" here).

  estimate_renewable_capacities:
    stats: "irena"
    year: 2020
    p_nom_min: 1
    p_nom_max: false
    technology_mapping:
      Offshore: [offwind-ac, offwind-dc]
      Onshore: [onwind]
      PV: [solar]

sector_coupling:
  h2_fertilizer: false        # off for this power-only run; set true only in your dedicated sector-coupled H2/EV scenario file

lines:
  ac_types:
    66.: "Al/St 240/40 2-bundle 220.0"
    132.: "Al/St 240/40 2-bundle 220.0"
    230.: "Al/St 240/40 3-bundle 300.0"
    400.: "Al/St 560/50 4-bundle 750.0"
  dc_types:
    66.:  "HVDC XLPE 1000"
    132.: "HVDC XLPE 1000"
    230.: "HVDC XLPE 1000"
    400.: "HVDC XLPE 1000"
  s_max_pu: 0.7
  s_nom_max: .inf
  length_factor: 1.25
  under_construction: "zero"

links:
  p_max_pu: 1.0
  p_nom_max: .inf
  under_construction: "zero"

transformers:
  x: 0.1
  s_nom: 2000.
  type: ""

export:
  results: true
  plots: true              # turned on — you'll want capacity/generation-mix figures straight out of this run for the paper
  excel: false
  netcdf: true
  ship: false
  store: false
  store_capital_costs: false
  export_profile: false
  endogenous: false
  endogenous_price: false
  h2export: false

atlite:
  nprocesses: 4
  cutouts:
    cutout-2018-era5:
      module: era5
      dx: 0.3
      dy: 0.3

renewable:
  onwind:
    cutout: cutout-2018-era5
    resource:
      method: wind
      turbine: Vestas_V112_3MW
    capacity_per_sqkm: 3
    copernicus:
      grid_codes: [20, 30, 40, 60]
      distance: 1000
      distance_grid_codes: [50]
    natura: true
    potential: conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  offwind-ac:
    cutout: cutout-2018-era5
    resource:
      method: wind
      turbine: NREL_ReferenceTurbine_5MW_offshore
    capacity_per_sqkm: 2
    correction_factor: 0.8855
    copernicus:
      grid_codes: [80, 200]
    natura: true
    max_depth: 50
    max_shore_distance: 30000
    potential: simple
    clip_p_max_pu: 1.e-2
    extendable: true
  offwind-dc:
    cutout: cutout-2018-era5
    resource:
      method: wind
      turbine: NREL_ReferenceTurbine_5MW_offshore
    capacity_per_sqkm: 3
    correction_factor: 0.8855
    copernicus:
      grid_codes: [80, 200]
    natura: true
    max_depth: 50
    min_shore_distance: 30000
    potential: conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  solar:
    cutout: cutout-2018-era5
    resource:
      method: pv
      panel: CSi
      orientation: latitude_optimal
    capacity_per_sqkm: 4.6
    correction_factor: 0.854337
    copernicus:
      grid_codes: [20, 30, 40, 50, 60, 90, 100]
    natura: true
    potential: simple
    clip_p_max_pu: 1.e-2
    extendable: true
  hydro:
    cutout: cutout-2013-era5
    hydrobasins_level: 4
    resource:
      method: hydro
      hydrobasins: data/hydrobasins/hybas_world.shp
      flowspeed: 1.0
    carriers: [ror, PHS, hydro]
    PHS_max_hours: 6
    hydro_max_hours: "energy_capacity_totals_by_country"
    hydro_max_hours_default: 6.0
    clip_min_inflow: 1.0
    extendable: true
    multiplier: 1.0

costs:
  year: 2030
  technology_data_version: v0.5.0
  version: v0.5.0
  rooftop_share: 0.20
  output_currency: USD
  cost_scenario: central
  financial_case: market
  currency_year: 2020
  retrieve_cost_data: true      # true so the run actually pulls technology-data instead of falling back on possibly stale local costs.csv
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    CO2 intensity: 0
    discount rate: 0.07
  marginal_cost:               # USD/MWh — moved OUT of fill_values (was nested wrong; PyPSA-Earth reads this at costs.marginal_cost)
    solar: 0.0118
    onwind: 0.0177
    offwind: 0.0177
    hydro: 0.
    H2: 0.
    electrolysis: 0.
    fuel cell: 0.
    battery: 0.
    battery inverter: 0.
  emission_prices:
    co2: 0.
  discountrate: 0.07

monte_carlo:
  options:
    add_to_snakefile: false
    samples: 7
    sampling_strategy: "chaospy"
  pypsa_standard:
    loads_t.p_set: [0.9, 1.1]

results_dir: "results"
summary_dir: "results/summary"
logs_dir: "logs"

subregions:
  add: false
subregion:
  define_by_gadm: {}
  path_custom_shapes: ""

solving:
  solver:
    name: highs
    options: highs-ipm
  solver_options:
    highs-ipm:
      solver: "ipm"
      run_crossover: "on"
      threads: 6
      parallel: "on"
      presolve: "on"
      primal_feasibility_tolerance: 1.0e-4
      dual_feasibility_tolerance: 1.0e-4
      ipm_optimality_tolerance: 1.0e-4
      user_bound_scale: 0
  options:
    minimum_renewable_generation: 0.20   # floor kept below the RES0.30 opts target so it never binds/conflicts with it
    skip_iterations: true
    max_iterations: 1
    nhours: 8760
    min_iterations: 1
    load_shedding: true
    noisy_costs: true
    store_basis: true
    keep_references: true
    keep_shadowprices: ['Generator', 'StorageUnit', 'Store', 'Bus', 'Line', 'Transformer', 'Link']
  # `extra_functionality: charge_from_res_only` was removed — that hook does not exist in
  # stock PyPSA-Earth and will raise an ImportError at solve time unless you have added this
  # custom function yourself under scripts/. Re-add only if you wrote and registered it.

plotting:
  map:
    figsize: [7, 7]
    boundaries: [88.01, 20.6, 92.7, 26.6]
    p_nom:
      bus_size_factor: 5.e+4
      linewidth_factor: 3.e+3

  costs_max: 800
  costs_threshold: 1

  energy_max: 15000.
  energy_min: -10000.
  energy_threshold: 50.

  vre_techs: ["onwind", "offwind-ac", "offwind-dc", "solar", "ror"]
  conv_techs: ["OCGT", "CCGT", "coal", "oil"]
  storage_techs: ["hydro+PHS", "battery", "H2"]
  load_carriers: ["AC load"]
  AC_carriers: ["AC line", "AC transformer"]
  link_carriers: ["DC line", "Converter AC-DC"]
  tech_colors:
    "onwind": "#235ebc"
    "onshore wind": "#235ebc"
    "offwind": "#6895dd"
    "offwind-ac": "#6895dd"
    "offshore wind": "#6895dd"
    "offshore wind ac": "#6895dd"
    "offwind-dc": "#74c6f2"
    "offshore wind dc": "#74c6f2"
    "hydro": "#08ad97"
    "hydro+PHS": "#08ad97"
    "PHS": "#08ad97"
    "hydro reservoir": "#08ad97"
    "hydroelectricity": "#08ad97"
    "ror": "#4adbc8"
    "run of river": "#4adbc8"
    "solar": "#f9d002"
    "solar PV": "#f9d002"
    "solar thermal": "#ffef60"
    "biomass": "#0c6013"
    "solid biomass": "#06540d"
    "biogas": "#23932d"
    "waste": "#68896b"
    "geothermal": "#ba91b1"
    "OCGT": "#d35050"
    "gas": "#d35050"
    "natural gas": "#d35050"
    "CCGT": "#b20101"
    "nuclear": "#ff9000"
    "coal": "#707070"
    "lignite": "#9e5a01"
    "oil": "#262626"
    "H2": "#ea048a"
    "hydrogen storage": "#ea048a"
    "battery": "#b8ea04"
    "Electric load": "#f9d002"
    "electricity": "#f9d002"
    "lines": "#70af1d"
    "transmission lines": "#70af1d"
    "AC-AC": "#70af1d"
    "AC line": "#70af1d"
    "links": "#8a1caf"
    "HVDC links": "#8a1caf"
    "DC-DC": "#8a1caf"
    "DC link": "#8a1caf"
    "load": "#FF0000"
  nice_names:
    OCGT: "Open-Cycle Gas"
    CCGT: "Combined-Cycle Gas"
    offwind-ac: "Offshore Wind (AC)"
    offwind-dc: "Offshore Wind (DC)"
    onwind: "Onshore Wind"
    solar: "Solar"
    PHS: "Pumped Hydro Storage"
    hydro: "Reservoir & Dam"
    battery: "Battery Storage"
    H2: "Hydrogen Storage"
    lines: "Transmission Lines"
    ror: "Run of River"
